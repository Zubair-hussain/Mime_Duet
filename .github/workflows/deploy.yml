name: Deploy site

# Publishes the static page in docs/ to GitHub Pages.
# It runs on every push to live/production that changes docs/ or this file. GitHub skips
# path-filtered workflows when a brand-new branch is first pushed, so a first deploy can also
# be started by hand: Actions > Deploy site > Run workflow.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# The production branch is live/production. If it is not the default branch, add it under
# Settings > Environments > github-pages > Deployment branches and tags.

on:
  push:
    branches: [live/production]
    paths:
      - "docs/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
